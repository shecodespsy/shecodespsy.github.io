<style>

.learn-more {
    position: absolute;
    top: 60%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    justify-content: center;
	flex-wrap: wrap;
    gap: 15px;
    padding: 10px 0;
    text-align: center;
    width: 100%;
}

.learn-more a {
    font-size: 22px;
    padding: 8px 16px;
    min-width: 120px;
    display: inline-block;
    color: #fff;
    /*text-decoration: none;*/
    text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
    transition: color 0.3s ease;
    white-space: nowrap;
}

.learn-more a:hover {
    color: #ffa74d;
}

@media screen and (max-width: 768px) {
    .learn-more {
        display: none;
    }
}



/* Programma: resta dentro alla colonna .text del sito */
.text .program { margin-top: 1.25rem; }

/* Giorno + separatore */
.text .program-day { margin: 2rem 0 1rem; }
.text .program-day .date {
  font-weight: 700; color: #ffa74d; letter-spacing: .02em;
  font-size: .95rem; text-transform: uppercase;
}
.text .program-sep {
  border: 0; height: 1px;
  background: linear-gradient(90deg, rgba(0,0,0,.08), rgba(35, 35, 35, 0.25), rgba(0,0,0,.08));
  margin: .75rem 0 1rem;
  width: 100%;   /* resta dentro .text */
}

/* Slot: orario a sinistra, dettagli a destra */
.text .slot {
  display: grid; grid-template-columns: 120px 1fr;
  column-gap: 16px; align-items: start; padding: .5rem 0;
}
.text .slot .time {
  font-variant-numeric: tabular-nums; white-space: nowrap; color: #111;
}
.text .slot .details { display: block; }

/* Tipo talk sopra al nome (niente badge) */
.text .slot .kind {
  font-size: .85rem; letter-spacing: .02em; opacity: .85; margin: 0 0 .2rem;
}
.text .slot .speaker { color: #ffa74d; font-weight: 700; }

/* Affiliazioni: corsivo, un filo più piccole, grigio scuro */
.text .slot .affil {
  font-style: italic;
  font-size: 0.95em;   /* appena più piccole */
  color: #3a3a3a;      /* grigio scuro leggibile */
  opacity: 0.9;          /* togliamo l'opacità per mantenere il contrasto */
}
.text .slot .talktitle { margin: .25rem 0 0; opacity: .9; }

/* Break/Lunch */
.text .slot.break .time { font-weight: 600; }
.text .slot.break .line { font-weight: 600; }

/* Mobile */
@media (max-width: 640px) {
  .text .slot { grid-template-columns: 96px 1fr; }
}
  
/* togli se vuoi il riquadro grigio in trasparenza nel titolo */
.hero-text-container {
  background: transparent !important;
  box-shadow: none !important;
  border-radius: 0 !important;
  padding: 0 !important;
}

</style>


<section class="hero" style="background-image: url({% include relative-src.html src=page.image %})">
	<div class="inner-hero text-container">
		<div class="hero-text-container">
			<h1 class="editable" style="text-shadow: 0px 0px 8px black; text-align: center;">Program of the course</h1>
      <p class="subtext editable" style="text-shadow: 1px 1px 5px black; text-align: center;">
				15-16-17 April, 2026 · University of Granada, Spain
			</p>	
			<!--<p class="subtext editable">Schedule of the conference</p>-->
		</div>
	</div>

	<div class="learn-more">
		<a href="#schedule"><span class="highlight">Schedule </span><span class="arrow">&#x25BC;</span></a>&nbsp;&nbsp;&nbsp;&nbsp;
		<!--<a href="#booklet"><span class="highlight">Booklets of the Abstracts </span><span class="arrow">&#x25BC;</span></a>&nbsp;&nbsp;&nbsp;&nbsp;-->
	</div>

</section>



<div class="content">

  <section class="info" id="schedule">
    <div class="container flex">

        <h3 class="editable" style="text-align: center; margin-top: 1em;">Provisional schedule</h3>

      </div>

      <div class="centered-image">
        <img src="{{ site.baseurl }}/images/program.png" alt="Program">
      </div>

    </div>
  </section>

  
  
</div>
